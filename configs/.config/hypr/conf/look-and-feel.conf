# =============================================================================
# ВНЕШНИЙ ВИД И ОФОРМЛЕНИЕ
# =============================================================================
# Настройка внешнего вида окон, анимаций, теней, размытия
# Документация: https://wiki.hypr.land/Configuring/Variables/

# ----------------------------------------------------------------------------
# ОБЩИЕ НАСТРОЙКИ
# ----------------------------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 5 # по умолчанию 20
    border_size = 0 # по умолчанию 2
    #col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    #col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

# ----------------------------------------------------------------------------
# ОФОРМЛЕНИЕ ОКОН
# ----------------------------------------------------------------------------
decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696

    }
}

# ----------------------------------------------------------------------------
# АНИМАЦИИ
# ----------------------------------------------------------------------------
animations {
    enabled = yes

    # ----------------------------------------------------------
    # КРИВЫЕ (оставляем лучшие + акцентные)
    # ----------------------------------------------------------
    bezier = superSmooth,   0.25, 0.1,  0.25, 1.0
    bezier = ultraSmooth,   0.23, 1.0,  0.32, 1.0
    bezier = megaSmooth,    0.4,  0.0,  0.2,  1.0
    bezier = butterSmooth,  0.25, 0.46, 0.45, 0.94
    bezier = silkSmooth,    0.33, 1.0,  0.68, 1.0
    bezier = velvetySmooth, 0.42, 0.0,  0.58, 1.0
    bezier = dreamySmooth,  0.55, 0.085,0.68, 0.53
    bezier = liquidSmooth,  0.61, 0.0,  0.39, 1.0
    bezier = softBounce,    0.68, -0.55, 0.265, 1.55
    bezier = elastic,       0.25, 1.5,  0.75, 1.0

    # ----------------------------------------------------------
    # 1. ГЛОБАЛЬНАЯ (короткая, без мыла)
    # ----------------------------------------------------------
    animation = global, 1, 4, superSmooth

    # ----------------------------------------------------------
    # 2. ОКНА — ИМПУЛЬС / ОБРЫВ / ИНЕРЦИЯ
    # ----------------------------------------------------------
    animation = windows,     1, 6, velvetySmooth
    animation = windowsIn,   1, 4, softBounce, popin 92%
    animation = windowsOut,  1, 3, megaSmooth, popin 95%
    animation = windowsMove, 1, 8, liquidSmooth

    # ----------------------------------------------------------
    # 3. ГРАНИЦЫ — ЖИВЫЕ, НО БЫСТРЫЕ
    # ----------------------------------------------------------
    animation = border,      1, 4, silkSmooth
    animation = borderangle, 1, 5, liquidSmooth

    # ----------------------------------------------------------
    # 4. FADE — МИНИМАЛЬНО И ТОЛЬКО ГДЕ НУЖНО
    # ----------------------------------------------------------
    animation = fade,        0
    animation = fadeIn,      1, 2.5, dreamySmooth
    animation = fadeOut,     1, 2,   dreamySmooth
    animation = fadeSwitch,  1, 3,   butterSmooth
    animation = fadeShadow,  1, 2,   silkSmooth
    animation = fadeDim,     1, 2,   silkSmooth
    animation = fadeDpms,    1, 2,   superSmooth

    # ----------------------------------------------------------
    # 5. СЛОИ — КАРТОЧКИ, А НЕ ДВЕРИ
    # ----------------------------------------------------------
    animation = layers,     1, 5, ultraSmooth
    animation = layersIn,   1, 4, elastic, popin 96%
    animation = layersOut,  1, 3, megaSmooth, popin 98%

    animation = fadeLayers,    0
    animation = fadeLayersIn,  0
    animation = fadeLayersOut, 0

    # ----------------------------------------------------------
    # 6. WORKSPACES — ПРОСТРАНСТВО И ГЛУБИНА
    # ----------------------------------------------------------
    animation = workspaces,    1, 6, liquidSmooth, slide
    animation = workspacesIn,  1, 4, silkSmooth,   slide
    animation = workspacesOut, 1, 3.5, dreamySmooth, slide

    # ----------------------------------------------------------
    # 7. SPECIAL WORKSPACE — ШОУ-РЕЖИМ
    # ----------------------------------------------------------
    animation = specialWorkspace,    1, 6, elastic

    # ----------------------------------------------------------
    # 8. POPUPS — МГНОВЕННЫЕ
    # ----------------------------------------------------------
    animation = fadePopups,    1, 2.5, velvetySmooth
    animation = fadePopupsOut, 1, 2,   dreamySmooth

    # ----------------------------------------------------------
    # 9. ZOOM — МИКРОАНИМАЦИЯ
    # ----------------------------------------------------------
    animation = zoomFactor, 1, 6, velvetySmooth
}

# ----------------------------------------------------------------------------
# DWINDLE LAYOUT
# ----------------------------------------------------------------------------
dwindle {
    preserve_split = true
}

# ----------------------------------------------------------------------------
# MASTER LAYOUT
# ----------------------------------------------------------------------------
master {
    new_status = master
}

# ----------------------------------------------------------------------------
# РАЗНОЕ
# ----------------------------------------------------------------------------
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}

