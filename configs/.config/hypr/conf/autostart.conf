# Программы, запускающиеся при старте Hyprland
# (демоны уведомлений, статус-бары, обои и т.д.)

exec-once = ~/.config/quickshell/scripts/start.sh
exec-once = sh -c 'WALL=$(cat ~/.config/quickshell/wallpaper/selected-wallpaper 2>/dev/null); [ -n "$WALL" ] && swaybg -i "$WALL" -m fill'